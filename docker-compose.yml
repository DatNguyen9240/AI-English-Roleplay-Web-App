version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: ai_roleplay_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ai_roleplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_roleplay_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password123@db:5432/ai_roleplay?schema=public
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-replace_with_a_long_random_secret_in_prod}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-10}
      - MAX_CONTEXT_MESSAGES=${MAX_CONTEXT_MESSAGES:-10}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-180000}
      - TTS_TOKEN_THRESHOLD=${TTS_TOKEN_THRESHOLD:-15}
      - USE_MOCKS=${USE_MOCKS:-true}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TTS_MODEL=${TTS_MODEL:-tts-1}
      - TTS_VOICE=${TTS_VOICE:-alloy}
      - WHISPER_BINARY_PATH=${WHISPER_BINARY_PATH}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH}
    depends_on:
      - db
    networks:
      - ai_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_roleplay_frontend
    restart: always
    ports:
      - "8080:443"
    depends_on:
      - backend
    networks:
      - ai_network

volumes:
  postgres_data:

networks:
  ai_network:
    driver: bridge
