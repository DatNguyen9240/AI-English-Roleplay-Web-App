version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: ai_roleplay_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ai_roleplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_roleplay_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password123@db:5432/ai_roleplay?schema=public
      - NODE_ENV=development
    depends_on:
      - db
    networks:
      - ai_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_roleplay_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ai_network

volumes:
  postgres_data:

networks:
  ai_network:
    driver: bridge
